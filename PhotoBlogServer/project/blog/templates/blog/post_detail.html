{% extends "blog/base.html" %} {% block content %}
<article>
  <small
    >{{ post.published_date|date:"Y-m-d H:i" }} · {{ post.author|default:"익명" }}</small
  >
  <h2>{{ post.title }}</h2>
  <p>{{ post.text }}</p>
  <img src="{{ post.image.url }}" alt="{{ post.title }}" />
</article>
<div class="actions">
  <a href="{% url 'post_list' %}">목록</a>
  <a href="{% url 'post_download' post.pk %}">사진 다운로드</a>
  {% if user == post.author or user.is_staff %}
  <a href="{% url 'post_edit' post.pk %}">수정</a>
  <a href="{% url 'post_delete' post.pk %}">삭제</a>
  {% endif %}
</div>
{% endblock %}
